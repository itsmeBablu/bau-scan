name: RoomScanner
configs:
  Debug: debug
  Release: release
  Release-Local: release
options:
  developmentLanguage: en
  knownRegions: [en, de]
  bundleIdPrefix: io.github.itsmebablu
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  generateEmptyDirectories: true

# Sparkle: auto-updater for macOS app only (no direct distribution outside
# App Store on iOS). Sole SPM dependency in the project.
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

# Explicit schemes (prevents xcodegen from losing schemes on regeneration).
# One scheme per platform, each with its dedicated test target.
schemes:
  RoomScanner:
    build:
      targets:
        RoomScanner: all
    test:
      targets:
        - RoomScannerTests
    run:
      config: Debug
  RoomScannerMac:
    build:
      targets:
        RoomScannerMac: all
    test:
      targets:
        - RoomScannerMacTests
    run:
      config: Debug

# Common settings for both apps (shared bundle ID across iOS/macOS).
settingGroups:
  app-common:
    PRODUCT_NAME: dWalkScan
    PRODUCT_MODULE_NAME: RoomScanner
    PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
  tests-common:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic

targets:
  # ---------------------------------------------------------------------------
  # iOS — RoomPlan scan + 3D/2D visualization + exports + local/iCloud storage
  # ---------------------------------------------------------------------------
  RoomScanner:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/GoogleAI.xcconfig
      Release: Config/GoogleAI.xcconfig
      Release-Local: Config/GoogleAI.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    sources:
      - path: RoomScanner
        excludes:
          - "**/*.entitlements"
          - "Info*.plist"
          - "MacUI/**"
    settings:
      groups: [app-common]
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.localtest
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROOMSCANNER_LOCAL_ONLY"
      configs:
        Release-Local:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.localtest
          CODE_SIGN_ENTITLEMENTS: ""
          DEVELOPMENT_TEAM: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROOMSCANNER_LOCAL_ONLY"
    info:
      path: RoomScanner/Info-iOS.plist
      properties:
        CFBundleName: dWalkScan
        CFBundleDisplayName: dWalkScan
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GIDClientID: "$(DWALK_GOOGLE_CLIENT_ID)"
        GIDServerClientID: "$(DWALK_GOOGLE_SERVER_CLIENT_ID)"
        TechnicalGoogleAIServiceURL: "$(DWALK_GOOGLE_AI_SERVICE_URL)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(DWALK_GOOGLE_REVERSED_CLIENT_ID)"]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # RoomPlan requires camera and ARKit (LiDAR).
        NSCameraUsageDescription: "dWalkScan uses the camera and LiDAR to scan rooms."
        UIRequiredDeviceCapabilities:
          - arkit
        # Local fallback folder visible in Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Package .roomscan: full scan bundle treated as single document.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.room
            UTTypeDescription: dWalkScan room scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [roomscan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.house
            UTTypeDescription: dWalkScan house scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [housescan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.technicalroom
            UTTypeDescription: dWalkScan technical survey
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [technicalroom]
        CFBundleDocumentTypes:
          - CFBundleTypeName: dWalkScan room scan
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.room]
          - CFBundleTypeName: dWalkScan house scan
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.house]
          - CFBundleTypeName: dWalkScan technical survey
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.technicalroom]

  RoomScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RoomScannerTests
    settings:
      groups: [tests-common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dWalkScan.app/dWalkScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoomScanner

  # ---------------------------------------------------------------------------
  # macOS — visualization, measurements, exports, printing, iCloud, Sparkle
  # (no scan capture: RoomPlan is iOS-only)
  # ---------------------------------------------------------------------------
  RoomScannerMac:
    configFiles:
      Debug: Config/GoogleAI.xcconfig
      Release: Config/GoogleAI.xcconfig
      Release-Local: Config/GoogleAI.xcconfig
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RoomScanner
        excludes:
          - "**/*.entitlements"
          - "Info*.plist"
          - "Scan/**"
          - "Viewer/ARPlacementController.swift"
    settings:
      groups: [app-common]
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: RoomScanner/RoomScanner-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    info:
      path: RoomScanner/Info-macOS.plist
      properties:
        CFBundleName: dWalkScan
        CFBundleDisplayName: dWalkScan
        CFBundleIdentifier: io.github.itsmebablu.dwalkscan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        GIDClientID: "$(DWALK_GOOGLE_CLIENT_ID)"
        GIDServerClientID: "$(DWALK_GOOGLE_SERVER_CLIENT_ID)"
        TechnicalGoogleAIServiceURL: "$(DWALK_GOOGLE_AI_SERVICE_URL)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(DWALK_GOOGLE_REVERSED_CLIENT_ID)"]
        NSHumanReadableCopyright: "© 2026 Babu Reddy"
        LSApplicationCategoryType: public.app-category.graphics-design
        # Sparkle auto-updater feed URL.
        SUFeedURL: "https://raw.githubusercontent.com/itsmeBablu/bau-scan/main/appcast.xml"
        # Add this fork's public EdDSA key and signed appcast before enabling updates.
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        # Sandboxed app installer support via XPC service.
        SUEnableInstallerLauncherService: true
        NSUbiquitousContainers:
          iCloud.io.github.itsmebablu.dwalkscan:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "dWalkScan"
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.room
            UTTypeDescription: dWalkScan room scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [roomscan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.house
            UTTypeDescription: dWalkScan house scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [housescan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.technicalroom
            UTTypeDescription: dWalkScan technical survey
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [technicalroom]
        CFBundleDocumentTypes:
          - CFBundleTypeName: dWalkScan room scan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.room]
          - CFBundleTypeName: dWalkScan house scan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.house]
          - CFBundleTypeName: dWalkScan technical survey
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.technicalroom]

  RoomScannerMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RoomScannerTests
    settings:
      groups: [tests-common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.mactests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dWalkScan.app/Contents/MacOS/dWalkScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoomScannerMac
