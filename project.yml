name: RoomScanner
configs:
  Debug: debug
  Release: release
  Release-Local: release
options:
  bundleIdPrefix: io.github.itsmebablu
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  generateEmptyDirectories: true

# Sparkle: auto-updater for macOS app only (no direct distribution outside
# App Store on iOS). Sole SPM dependency in the project.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

# Explicit schemes (prevents xcodegen from losing schemes on regeneration).
# One scheme per platform, each with its dedicated test target.
schemes:
  RoomScanner:
    build:
      targets:
        RoomScanner: all
    test:
      targets:
        - RoomScannerTests
    run:
      config: Debug
  RoomScannerMac:
    build:
      targets:
        RoomScannerMac: all
    test:
      targets:
        - RoomScannerMacTests
    run:
      config: Debug

# Common settings for both apps (shared bundle ID across iOS/macOS).
settingGroups:
  app-common:
    PRODUCT_NAME: dWalkScan
    PRODUCT_MODULE_NAME: RoomScanner
    PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KFLACS69T9
    SWIFT_STRICT_CONCURRENCY: minimal
  tests-common:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KFLACS69T9

targets:
  # ---------------------------------------------------------------------------
  # iOS — RoomPlan scan + 3D/2D visualization + exports + iCloud
  # ---------------------------------------------------------------------------
  RoomScanner:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RoomScanner
        excludes:
          - "**/*.entitlements"
          - "Info*.plist"
          - "MacUI/**"
    settings:
      groups: [app-common]
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: RoomScanner/RoomScanner-iOS.entitlements
      configs:
        Release-Local:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.localtest
          CODE_SIGN_ENTITLEMENTS: ""
          DEVELOPMENT_TEAM: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROOMSCANNER_LOCAL_ONLY"
    info:
      path: RoomScanner/Info-iOS.plist
      properties:
        CFBundleName: dWalkScan
        CFBundleDisplayName: dWalkScan
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # RoomPlan requires camera and ARKit (LiDAR).
        NSCameraUsageDescription: "dWalkScan uses the camera and LiDAR to scan rooms."
        UIRequiredDeviceCapabilities:
          - arkit
        # Local fallback folder visible in Files app (when iCloud is inactive).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # iCloud Drive container exposed as public 'dWalkScan' folder in Files app.
        NSUbiquitousContainers:
          iCloud.io.github.itsmebablu.dwalkscan:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "dWalkScan"
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Package .roomscan: full scan bundle treated as single document.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.room
            UTTypeDescription: dWalkScan room scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [roomscan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.house
            UTTypeDescription: dWalkScan house scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [housescan]
        CFBundleDocumentTypes:
          - CFBundleTypeName: dWalkScan room scan
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.room]
          - CFBundleTypeName: dWalkScan house scan
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.house]

  RoomScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RoomScannerTests
    settings:
      groups: [tests-common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dWalkScan.app/dWalkScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoomScanner

  # ---------------------------------------------------------------------------
  # macOS — visualization, measurements, exports, printing, iCloud, Sparkle
  # (no scan capture: RoomPlan is iOS-only)
  # ---------------------------------------------------------------------------
  RoomScannerMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RoomScanner
        excludes:
          - "**/*.entitlements"
          - "Info*.plist"
          - "Scan/**"
          - "Viewer/ARPlacementController.swift"
    settings:
      groups: [app-common]
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: RoomScanner/RoomScanner-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle
    info:
      path: RoomScanner/Info-macOS.plist
      properties:
        CFBundleName: dWalkScan
        CFBundleDisplayName: dWalkScan
        CFBundleIdentifier: io.github.itsmebablu.dwalkscan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Babu Reddy"
        LSApplicationCategoryType: public.app-category.graphics-design
        # Sparkle auto-updater feed URL.
        SUFeedURL: "https://raw.githubusercontent.com/itsmeBablu/d-walk-scan/main/appcast.xml"
        # Sparkle public EdDSA key.
        SUPublicEDKey: "qSGDP0w1B/HVt1++Bxip35K+OUI6NUvJUSxmfY9rbhE="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        # Sandboxed app installer support via XPC service.
        SUEnableInstallerLauncherService: true
        NSUbiquitousContainers:
          iCloud.io.github.itsmebablu.dwalkscan:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "dWalkScan"
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.room
            UTTypeDescription: dWalkScan room scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [roomscan]
          - UTTypeIdentifier: io.github.itsmebablu.dwalkscan.house
            UTTypeDescription: dWalkScan house scan
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [housescan]
        CFBundleDocumentTypes:
          - CFBundleTypeName: dWalkScan room scan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.room]
          - CFBundleTypeName: dWalkScan house scan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.itsmebablu.dwalkscan.house]

  RoomScannerMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RoomScannerTests
    settings:
      groups: [tests-common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itsmebablu.dwalkscan.mactests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dWalkScan.app/Contents/MacOS/dWalkScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoomScannerMac
